plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.android.libraries.mapsplatform.secrets.gradle.plugin)
    id("com.google.gms.google-services")
}

android {
    namespace 'com.smartfamily.studentplanner'
    compileSdk 35

    defaultConfig {
        applicationId "com.smartfamily.studentplanner"
        minSdk 26
        targetSdk 35
        versionCode 110
        versionName "1.0.9"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation(platform(libs.firebase.bom))
    implementation(libs.google.firebase.analytics)
    implementation libs.appcompat
    implementation libs.material
    implementation libs.play.services.maps
    implementation libs.constraintlayout
    implementation libs.activity
    implementation libs.firebase.messaging
    testImplementation libs.junit
    testImplementation libs.ext.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation libs.firebase.analytics
    implementation libs.firebase.auth
    implementation libs.firebase.core

    // Google Sign-In
    implementation libs.play.services.auth

    implementation "androidx.sqlite:sqlite:2.4.0"

    // Room dependencies
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"

    implementation 'androidx.annotation:annotation:1.9.1'

    // dependencies for room testing
    implementation libs.room.testing

    // For testing LiveData
    implementation libs.androidx.core.testing.v210

    // For Google maps
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // To perform swipe on tasks
    implementation("androidx.viewpager2:viewpager2:1.0.0")
}
apply plugin: 'com.google.gms.google-services'